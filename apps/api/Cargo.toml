[package]
name = "dugong-api"
version = "0.1.0"
edition = "2021"

[lib]
name = "dugong_api"
path = "src/lib.rs"

[[bin]]
name = "dugong-api"
path = "src/main.rs"

[[bin]]
name = "dugong-indexer"
path = "src/bin/indexer.rs"

[[bin]]
name = "dugong-login"
path = "src/bin/login.rs"

[[bin]]
name = "dugong-test-tweet"
path = "src/bin/test_tweet.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "chrono", "json"] }

# Redis
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Sui SDK - all pinned to the same testnet commit for consistency
sui-sdk = { git = "https://github.com/MystenLabs/sui", package = "sui-sdk", rev = "94ad8ccd0ed6c089a9fe072ff80c918b5ab44943" }
sui-types = { git = "https://github.com/MystenLabs/sui", package = "sui-types", rev = "94ad8ccd0ed6c089a9fe072ff80c918b5ab44943" }
sui-keys = { git = "https://github.com/MystenLabs/sui", package = "sui-keys", rev = "94ad8ccd0ed6c089a9fe072ff80c918b5ab44943" }
bcs = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Intent / signature utilities (Sui)
shared-crypto = { git = "https://github.com/MystenLabs/sui", package = "shared-crypto", rev = "94ad8ccd0ed6c089a9fe072ff80c918b5ab44943" }

# Fastcrypto for hash traits (needed for signing) - matching the Sui SDK dependency.
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "0eea35ee442a798fb1f1e7c2f39dc021bd21dbc3" }

# Crypto
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.21"
hex = "0.4"

# JWT
jsonwebtoken = "9"

# Config & env
dotenvy = "0.15"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Regex
regex = "1"

[dev-dependencies]
