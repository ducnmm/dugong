[package]
name = "dugong-api"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "dugong_api"
path = "src/lib.rs"

[[bin]]
name = "dugong-api"
path = "src/main.rs"

[dependencies]
dugong-core.workspace = true

# Web framework
axum.workspace = true
tower.workspace = true
tower-http.workspace = true

# Async runtime
tokio.workspace = true
async-trait.workspace = true

# Database (handlers extract PgPool from state)
sqlx.workspace = true

# Redis (error type bridged in error.rs)
redis.workspace = true

# HTTP client (for outbound calls in routes)
reqwest.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Sui types referenced in routes
sui-sdk.workspace = true
sui-types.workspace = true
sui-keys.workspace = true
shared-crypto.workspace = true
fastcrypto.workspace = true
bcs.workspace = true

# Webhook signature / general crypto
hmac.workspace = true
sha1.workspace = true
sha2.workspace = true
base64.workspace = true
hex.workspace = true

# JWT (Twitter OAuth)
jsonwebtoken.workspace = true

# Config & env
dotenvy.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Time
chrono.workspace = true

# Regex
regex.workspace = true

[dev-dependencies]
